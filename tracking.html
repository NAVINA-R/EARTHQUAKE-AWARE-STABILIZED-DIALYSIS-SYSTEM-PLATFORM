<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ambulance Tracking - ESDS</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="navbar-container"></div>
    <div id="emergency-banner-container"></div>
    
    <div class="container">
        <div class="card">
            <h2>🚑 Real-time Ambulance Tracking</h2>
            <div id="ambulanceMap" style="height: 400px; background: #e2e8f0; border-radius: 16px; display: flex; align-items: center; justify-content: center;">
                <p>Interactive ambulance tracking map would load here</p>
            </div>
        </div>
        <div class="card">
            <h2>📊 Active Transports</h2>
            <div id="activeTransports">
                <div class="transport-item">🚑 Unit A-102 - En route to ESDS Central - ETA 12min</div>
                <div class="transport-item">🚑 Unit B-045 - At pickup location - Loading patient</div>
                <div class="transport-item">🚑 Unit C-078 - Returning to base</div>
            </div>
        </div>
    </div>
</body>
</html>
